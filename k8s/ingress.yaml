apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-news
  namespace: kube-news
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: kubenews.arbtech.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-news
                port:
                  name: http
  tls:
    - hosts:
        - kubenews.arbtech.com.br
      secretName: kube-news-tls
