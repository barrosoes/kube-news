apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-news
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/barrosoes/kube-news.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-news
  syncPolicy:
    automated: {}
