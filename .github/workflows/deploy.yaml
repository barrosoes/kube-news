name: deploy

on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  security-events: write

env:
  IMAGE: barrosoes/kube-news

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (carrega localmente)
        uses: docker/build-push-action@v6
        with:
          context: src
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Enviar SARIF para a aba Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Trivy (resumo da execução)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          format: table
          output: trivy.txt
          exit-code: '0'

      - name: Publicar resumo
        run: |
          {
            echo "### Trivy — ${IMAGE}:${TAG}"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha

      - name: Atualizar imagem em k8s/app.yaml
        run: |
          sed -i -E "s#^(\s*image: )${IMAGE}:.*#\1${IMAGE}:${TAG}#" k8s/app.yaml
          test "$(git diff --numstat k8s/app.yaml | cut -f1,2)" = "$(printf '1\t1')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/app.yaml
          git commit -m "chore(deploy): kube-news ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
